spring.application.name=SchemeService
server.port=2305

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/schemedb?createDatabaseIfNotExist=true

# Hibernate properties
spring.jpa.format-sql=true

# File upload
file.upload-dir=uploads

# Actuator endpoints
management.endpoints.web.exposure.include=*

eureka.instance.prefer-ip-address=true

# Config server import
spring.config.import=configserver:http://localhost:8711



